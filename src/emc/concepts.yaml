# EMC Concepts Taxonomy
# Maps deterministic detector rules and question generation to mastery concepts.
version: "1.0.0"

concepts:
  # Rust / Anchor smart contract concepts
  - id: "anchor.signer_check"
    name: "Anchor Signer & Authority Verification"
    category: "rust_anchor"
    severity_default: "CRITICAL"
    description: "Verifies that accounts performing privileged actions (e.g. transfers, state mutations, admin instructions) are explicitly verified as signers via Signer<'info>, #[account(signer)], or has_one constraints."
    remediation: "Replace AccountInfo<'info> with Signer<'info>, or add #[account(signer)] or #[account(has_one = authority)]."
    doc_url: "https://www.anchor-lang.com/docs/account-types#signer"

  - id: "anchor.account_types"
    name: "Anchor UncheckedAccount Safety Documentation"
    category: "rust_anchor"
    severity_default: "HIGH"
    description: "Ensures UncheckedAccount<'info> or raw AccountInfo are accompanied by clear '/// CHECK:' safety doc comments explaining why verification is not performed or handled manually."
    remediation: "Add an explicit '/// CHECK: <reason>' comment detailing the manual validation performed in instruction logic."
    doc_url: "https://www.anchor-lang.com/docs/account-types#uncheckedaccount"

  - id: "math.checked_arith"
    name: "Smart Contract Checked Arithmetic"
    category: "rust_anchor"
    severity_default: "HIGH"
    description: "Ensures balance, token, lamport, and numerical computations use checked (checked_add, checked_sub) or saturating arithmetic to prevent integer overflow and underflow vulnerabilities."
    remediation: "Replace raw arithmetic operators (+, -, *, /) with .checked_add(), .checked_sub(), or .saturating_add()."
    doc_url: "https://docs.solana.com/developing/programming-model/overview#integer-overflow"

  - id: "anchor.pda_seeds"
    name: "PDA Seeds & Bump Verification"
    category: "rust_anchor"
    severity_default: "HIGH"
    description: "Guarantees Program Derived Addresses (PDAs) use canonical bump derivation and validation rather than hardcoded bumps or unconstrained seed slices."
    remediation: "Specify canonical bump verification: #[account(seeds = [...], bump = account.bump)] or bump constraint without hardcoded literal."
    doc_url: "https://www.anchor-lang.com/docs/pdas"

  - id: "anchor.invoke_signed"
    name: "Safe invoke_signed CPI Seeds"
    category: "rust_anchor"
    severity_default: "CRITICAL"
    description: "Ensures cross-program invocations using invoke_signed supply valid PDA signer seed slices containing appropriate bump seeds and matching signing authority."
    remediation: "Pass valid 3-level seed slices: &[&[SEED_PREFIX, authority.as_ref(), &[bump]]] with canonical bump."
    doc_url: "https://docs.solana.com/developing/programming-model/calling-between-programs#cross-program-invocations"

  - id: "anchor.realloc_close"
    name: "Account Realloc and Close Safety"
    category: "rust_anchor"
    severity_default: "HIGH"
    description: "Prevents account revival attacks and unauthorized resizing by enforcing proper rent exemption, zero initialization (realloc::zero), and designated close targets."
    remediation: "Use Anchor's #[account(mut, close = target)] or #[account(realloc = len, realloc::payer = payer, realloc::zero = false)] constraints."
    doc_url: "https://www.anchor-lang.com/docs/realloc"

  - id: "anchor.remaining_accounts"
    name: "Remaining Accounts Validation"
    category: "rust_anchor"
    severity_default: "HIGH"
    description: "Ensures iteration over ctx.remaining_accounts validates account ownership, signer status, and expected collection length before use."
    remediation: "Assert acc.is_signer, acc.owner == expected_program, and slice bounds on remaining_accounts."
    doc_url: "https://www.anchor-lang.com/docs/context#remaining-accounts"

  - id: "anchor.cpi_checks"
    name: "CPI Target Program ID Validation"
    category: "rust_anchor"
    severity_default: "CRITICAL"
    description: "Validates that CPI target programs match the authentic expected on-chain program IDs (e.g. Anchor Program<'info, Token> or explicit key equality checks) preventing malicious program injection."
    remediation: "Use Program<'info, TargetProgram> or assert require_keys_eq!(ctx.accounts.target_program.key(), expected_id)."
    doc_url: "https://www.anchor-lang.com/docs/cpi"

  # TypeScript / Solana Wallet concepts
  - id: "ts.lamport_units"
    name: "Lamport & Decimal Scaling Precision"
    category: "ts_wallet"
    severity_default: "HIGH"
    description: "Prevents mixing SOL with lamports (1 SOL = 10^9 lamports) and avoids floating-point precision loss when computing balances or transfer fees."
    remediation: "Use BN or BigInt for balance computations and explicitly multiply/divide by LAMPORTS_PER_SOL."
    doc_url: "https://solana.com/docs/core/accounts#lamports"

  - id: "ts.base_units"
    name: "Token Base Units vs Human Units"
    category: "ts_wallet"
    severity_default: "HIGH"
    description: "Ensures token amounts are correctly scaled by mint decimals when transferring, minting, or burning on-chain SPL tokens."
    remediation: "Scale UI units to raw base units: BigInt(Math.floor(uiAmount * (10 ** decimals))) or parseUnits."
    doc_url: "https://spl.solana.com/token#decimals"

  - id: "ts.address_validation"
    name: "Solana PublicKey & Address Validation"
    category: "ts_wallet"
    severity_default: "MEDIUM"
    description: "Ensures user-supplied address strings are verified with PublicKey validation, try/catch constructor safety, and curve checks (isOnCurve)."
    remediation: "Wrap new PublicKey(str) in try/catch or validate with PublicKey.isOnCurve before transaction assembly."
    doc_url: "https://solana-labs.github.io/solana-web3.js/classes/PublicKey.html"

  - id: "ts.rpc_security"
    name: "RPC Endpoint Security & Configuration"
    category: "ts_wallet"
    severity_default: "HIGH"
    description: "Prevents hardcoding production or rate-limited RPC endpoints directly in source files."
    remediation: "Load RPC endpoint from environment variables: process.env.SOLANA_RPC_URL with fallback to clusterApiUrl."
    doc_url: "https://solana.com/docs/core/clusters"

  # Generic code smell concepts
  - id: "generic.bypass_flags"
    name: "Security Bypass and Unsafe Flags"
    category: "generic"
    severity_default: "HIGH"
    description: "Detects dangerous bypass flags such as skip_auth, dangerouslySetInnerHTML, @ts-ignore, or disabled verification checks in diff additions."
    remediation: "Remove bypass flags and enforce proper authorization and type checking."
    doc_url: ""

  - id: "generic.sensitive_exposure"
    name: "Sensitive Data Logging & Exposure"
    category: "generic"
    severity_default: "MEDIUM"
    description: "Flags debug or error logging statements that output private keys, secrets, auth tokens, or passwords to logs or console."
    remediation: "Remove sensitive variables from log statements or apply structured redaction."
    doc_url: ""

  - id: "generic.hardcoded_fallbacks"
    name: "Insecure Hardcoded Fallback Credentials"
    category: "generic"
    severity_default: "HIGH"
    description: "Detects insecure fallback values like `process.env.SECRET || 'default'` or hardcoded auth secrets in diffs."
    remediation: "Fail fast if required security environment variables are missing rather than using hardcoded defaults."
    doc_url: ""

  - id: "generic.silent_error_handling"
    name: "Silent Exception Swallowing"
    category: "generic"
    severity_default: "MEDIUM"
    description: "Detects empty catch or except blocks that silently discard critical runtime errors or security exceptions."
    remediation: "Properly handle, log, or re-throw caught exceptions."
    doc_url: ""
