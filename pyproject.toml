[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explain-my-own-code"
version = "1.0.0"
description = "Local-first developer safety CLI and git commit comprehension gate for AI-generated diffs"
readme = "README.md"
authors = [
    { name = "Tejas Mhamane", email = "tejas@mhamane.dev" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = [
    "solana",
    "anchor",
    "security",
    "developer-tools",
    "cli",
    "git-hook",
    "ai-safety",
    "code-review",
    "comprehension-gate",
    "leitner-system",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pathspec>=0.12.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "setuptools>=61.0",
    "wheel>=0.42.0",
    "build>=1.1.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/tejasmhamane1224/explain-my-own-code"
Documentation = "https://github.com/tejasmhamane1224/explain-my-own-code#readme"
Repository = "https://github.com/tejasmhamane1224/explain-my-own-code"
Issues = "https://github.com/tejasmhamane1224/explain-my-own-code/issues"
Changelog = "https://github.com/tejasmhamane1224/explain-my-own-code/blob/main/CHANGELOG.md"

[project.scripts]
emc = "emc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emc = ["concepts.yaml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
